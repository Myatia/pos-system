<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}POS{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <h1>POS</h1>
    <nav>
      {% for s, e in entities.items() %}
        <a href="{{ url_for('crud_page', slug=s) }}" class="{{ 'active' if s == slug }}">{{ e.title }}</a>
      {% endfor %}
    </nav>
  </header>

  <main>
    {# Messages saved with flash() in app.py appear here once #}
    {% for category, message in get_flashed_messages(with_categories=true) %}
      <div class="msg {{ category }}" role="alert">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
